<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <title>青蛙公主</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    html.immersive-mode,
    html.immersive-mode body {
      width: 100vw;
      height: 100dvh;
      height: 100svh;
      min-height: -webkit-fill-available;
      position: fixed;
      inset: 0;
    }
    #game-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      height: 100svh;
      min-height: -webkit-fill-available;
      position: fixed;
      inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #game-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    #rotate-hint {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(8, 12, 24, 0.92);
      color: #ffd878;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      text-align: center;
      padding: 2rem;
    }
    #rotate-hint .icon {
      font-size: 3.5rem;
      animation: rotate-pulse 2s ease-in-out infinite;
    }
    #rotate-hint p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #e8dcc8;
    }
    @keyframes rotate-pulse {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
    }
    @media (orientation: portrait) and (max-width: 900px) {
      #rotate-hint { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate-hint" aria-hidden="true">
    <div class="icon">📱</div>
    <p>请将手机<strong>横屏</strong>以获得最佳体验<br>《青蛙公主》为横版全屏游戏</p>
  </div>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
